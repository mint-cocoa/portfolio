<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc">
  <title id="title">Session lifetime</title>
  <desc id="desc">Timeline diagram of a Session from Start and SessionManager ownership through kOpen, kClosing, kDraining, kClosed, pending_io drain, pending_app_io drain, OnDisconnected, SessionManager release, and final destruction after remaining strong references are gone.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      text { font-family: "Noto Sans CJK KR", "Noto Sans KR", "DejaVu Sans", sans-serif; }
      .title { fill: #111827; font-size: 34px; font-weight: 800; }
      .subtitle { fill: #475569; font-size: 16px; font-weight: 500; }
      .axis { stroke: #334155; stroke-width: 4; stroke-linecap: round; marker-end: url(#axisArrow); }
      .tick { stroke: #94a3b8; stroke-width: 2.2; }
      .tickText { fill: #52637a; font-size: 13px; font-weight: 700; }
      .laneText { fill: #111827; font-size: 18px; font-weight: 800; }
      .small { fill: #475569; font-size: 14px; font-weight: 600; }
      .tiny { fill: #64748b; font-size: 12px; font-weight: 600; }
      .code { fill: #334155; font-size: 12px; font-weight: 700; }
      .manager { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.4; }
      .stateOpen { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.4; }
      .stateClosing { fill: #fef3c7; stroke: #d97706; stroke-width: 2.4; }
      .stateDraining { fill: #ffe4e6; stroke: #e11d48; stroke-width: 2.4; }
      .gate { fill: #ffffff; stroke: #334155; stroke-width: 2.2; }
      .eventOwner { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2.4; }
      .noteBox { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .softFlow { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#softArrow); }
      .redFlow { fill: none; stroke: #dc2626; stroke-width: 2.5; marker-end: url(#redArrow); }
      .blocked { stroke: #dc2626; stroke-width: 3; }
    </style>
    <marker markerUnits="userSpaceOnUse" id="axisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9" fill="none"
         stroke="#334155"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 2 1 L 8 5 L 2 9" fill="none"
         stroke="#334155"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="softArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 2 1 L 8 5 L 2 9" fill="none"
         stroke="#64748b"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 2 1 L 8 5 L 2 9" fill="none"
         stroke="#dc2626"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="570"/>
  <g id="content-shift" transform="translate(0,-74)">

  <line class="axis" x1="168" y1="134" x2="1138" y2="134"/>
  <g>
    <line class="tick" x1="190" y1="112" x2="190" y2="616"/>
    <line class="tick" x1="390" y1="112" x2="390" y2="616"/>
    <line class="tick" x1="610" y1="112" x2="610" y2="616"/>
    <line class="tick" x1="835" y1="112" x2="835" y2="616"/>
    <line class="tick" x1="1050" y1="112" x2="1050" y2="616"/>
    <text class="tickText" x="190" y="108" text-anchor="middle">Start</text>
    <text class="tickText" x="390" y="108" text-anchor="middle">normal I/O</text>
    <text class="tickText" x="610" y="108" text-anchor="middle">Disconnect</text>
    <text class="tickText" x="835" y="108" text-anchor="middle">CQE drain</text>
    <text class="tickText" x="1050" y="108" text-anchor="middle">Release</text>
  </g>

  <text class="laneText" x="48" y="202">SessionManager</text>
  <rect class="manager" x="190" y="172" width="860" height="220" rx="8"/>
  <text class="small" x="214" y="197">connected session 목록에 남아 외부에서 현재 연결로 보인다</text>
  <text class="tiny" x="214" y="218">Start(): Sessions().Add(self), OnConnected(), RegisterRecv()</text>
  <path class="redFlow" d="M 1050 203 L 1148 203"/>
  <text class="small" x="1068" y="166">Sessions().Release(self)</text>

  <text class="laneText" x="48" y="313">SessionState</text>
  <rect class="stateOpen" x="190" y="282" width="420" height="187" rx="8"/>
  <text class="small" x="214" y="307">kOpen: 새 recv/send/register 허용</text>
  <text class="tiny" x="214" y="328">CanUseOnOwner() == true</text>

  <rect class="stateClosing" x="610" y="282" width="225" height="300" rx="8"/>
  <text class="small" x="634" y="307">kClosing: 새 일반 작업 차단</text>
  <text class="tiny" x="634" y="328">TryBeginDisconnectOnOwner()</text>

  <rect class="stateDraining" x="835" y="282" width="215" height="174" rx="8"/>
  <text class="small" x="859" y="307">kDraining: 남은 CQE 비움</text>
  <text class="tiny" x="859" y="328">MarkDrainingOnOwner()</text>
  <text class="small" x="1080" y="307">kClosed</text>
  <text class="tiny" x="1080" y="328">TryMarkClosedOnOwner()</text>

  <text class="laneText" x="48" y="423">callback 참조</text>
  <rect class="eventOwner" x="390" y="392" width="445" height="190" rx="8"/>
  <text class="small" x="414" y="417">Op owner SessionRef: 콜백 대상 생존</text>
  <text class="tiny" x="414" y="438">BeginPendingIo()는 성공한 SQE마다 증가</text>
  <text class="tiny" x="414" y="451">최종 CQE에서 CompletePendingIo()</text>

  <rect class="eventOwner" x="835" y="392" width="215" height="64" rx="8"/>
  <text class="small" x="859" y="417">pending_io_ == 0</text>
  <text class="tiny" x="859" y="438">pending_app_io_ == 0도 필요</text>

  <text class="laneText" x="48" y="533">해제 게이트</text>
  <rect class="gate" x="610" y="500" width="440" height="82" rx="8"/>
  <text class="small" x="634" y="525">TryRelease()</text>
  <text class="tiny" x="634" y="547">ClosingStarted() &amp;&amp; pending_io_ == 0 &amp;&amp; pending_app_io_ == 0</text>
  <text class="tiny" x="634" y="564">통과 시 OnDisconnected(), Sessions().Release(self)</text>
  <path class="flow" d="M 1050 535 L 1140 535"/>
  <text class="small" x="1082" y="560">외부 연결 수명 종료</text>

  <path class="flow" d="M 190 234 L 190 282"/>
  <path class="flow" d="M 390 344 L 390 392"/>
  <path class="flow" d="M 610 344 L 610 500"/>
  <path class="flow" d="M 835 344 L 835 392"/>
  <path class="flow" d="M 942 454 L 942 500"/>
  <path class="flow" d="M 1050 570 L 1050 235"/>

  <line class="blocked" x1="652" y1="366" x2="682" y2="396"/>
  <line class="blocked" x1="682" y1="366" x2="652" y2="396"/>
  <text class="code" x="700" y="385">kOpen이 아니면 Send/RegisterRecv 차단</text>

  <path class="softFlow" d="M 835 454 C 788 482, 731 482, 690 500"/>
  <text class="code" x="708" y="482">아직 남은 CQE나 앱 작업이 있으면 대기</text>

  </g></svg>

