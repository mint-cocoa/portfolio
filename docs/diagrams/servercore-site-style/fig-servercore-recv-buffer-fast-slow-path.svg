  <title
     id="title">Recv buffer fast and slow paths</title>
  <desc
     id="desc">The io_uring provided buffer span is valid only during the receive callback. Complete frames are parsed directly from the span, while incomplete tails are copied into the session-owned RecvBuffer and joined with later receives.</desc>
