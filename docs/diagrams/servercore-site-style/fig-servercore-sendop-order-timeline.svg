  <title
     id="title">SendOp ordering timeline</title>
  <desc
     id="desc">A comparison timeline shows why multiple outstanding SendOps can make payload ordering and partial-send cursor ownership unclear, while a single active SendOp preserves FIFO order by completing or rearming the current payload before starting the next one.</desc>
