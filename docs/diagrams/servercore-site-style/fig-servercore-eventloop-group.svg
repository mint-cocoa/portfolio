  <title
     id="title">ServerCore 워커 풀과 io_uring 실행 루프</title>
  <desc
     id="desc">각 워커 스레드는 IoRing, Listener, BufferPool, SessionManager를 소유하고, 수락과 세션 I/O 완료를 같은 owner 실행 루프에서 처리한다. 프로토콜 모듈은 Core 밖에서 바이트 의미를 해석하고 다시 Session send 표면으로 내려온다.</desc>
