  <title
     id="title">Room의 논리 순서와 Session의 바이트 순서</title>
  <desc
     id="desc">Room은 게임 상태 변경과 출력 메시지의 논리 순서를 본다. Session은 같은 연결의 SendQueue, active SendOp, TCP stream 위에서 바이트 순서와 부분 송신 커서를 본다.</desc>
