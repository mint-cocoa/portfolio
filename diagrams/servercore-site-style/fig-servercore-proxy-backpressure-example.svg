  <title
     id="title">Proxy write backpressure and paused recv queue ownership</title>
  <desc
     id="desc">Four panels use a consistent layout. Recv chunks enter OnRecv bridge, are enqueued into the opposite peer SendQueue, high watermark is shown as a vertical queue length threshold, late completed recv chunks are copied into PausedRecvQueue while OnRecv is not called, and queued chunks are replayed FIFO through OnRecv before recv resumes.</desc>
