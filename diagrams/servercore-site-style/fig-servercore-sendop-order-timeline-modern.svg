  <title
     id="title">Modern single active SendOp timeline</title>
  <desc
     id="desc">A modernized comparison diagram showing that multiple active SendOps can split payload FIFO order from completion order, while a single active SendOp keeps partial cursor progress and FIFO order on one timeline.</desc>
