name: portfolio image and pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Render portfolio documents
        run: ./scripts/render-docs.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mint-cocoa/portfolio:${{ github.sha }}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: mint-cocoa/home-k8s-gitops
          token: ${{ secrets.HOME_K8S_GITOPS_TOKEN }}
          path: home-k8s-gitops

      - name: Update portfolio image tag
        working-directory: home-k8s-gitops
        run: |
          sed -i 's/tag: ".*"/tag: "'"${GITHUB_SHA}"'"/' apps/portfolio/values.yaml

      - name: Commit GitOps update
        working-directory: home-k8s-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/portfolio/values.yaml
          git commit -m "deploy portfolio ${GITHUB_SHA}" || exit 0
          git push

  publish-pages:
    runs-on: ubuntu-latest
    concurrency:
      group: portfolio-pages
      cancel-in-progress: true
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare Quarto project
        run: QUARTO_OUTPUT_DIR=_site node scripts/prepare-servercore-docs.js

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: generated-quarto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload rendered Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: generated-quarto/_site

      - name: Deploy rendered Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
