  <title
     id="title">Paused recv queue as a buffer ownership handoff</title>
  <desc
     id="desc">A buffer-centered diagram showing that when recv is paused, late completed CQE spans are copied from the temporary provided buffer into a bounded PausedRecvQueue, the provided buffer is returned, and queued chunks are replayed before new recv registration after resume.</desc>
