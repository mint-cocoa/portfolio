  <title
     id="title">SendQueue pressure returns to producer boundaries</title>
  <desc
     id="desc">Abstract backpressure structure showing producer boundaries, the SendQueue pressure core with high and low watermarks, and drain-driven resume paths. The figure emphasizes internal shape and order rather than a simple vertical control arrow.</desc>
