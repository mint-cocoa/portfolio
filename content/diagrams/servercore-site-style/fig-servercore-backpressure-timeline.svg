  <title
     id="title">Backpressure timeline with four snapshots</title>
  <desc
     id="desc">Four snapshots show normal recv forwarding, high send pressure, recv pause with late completed chunks copied into PausedRecvQueue, and FIFO drain before recv resumes.</desc>
