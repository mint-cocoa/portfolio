  <title
     id="title">HTTP response send paths by body size</title>
  <desc
     id="desc">Small HTTP responses are sent as one inline header and body buffer. Large responses send the header first, keep the body in BodyStreamState, and pump bounded 256 KiB chunks as socket drain events allow more output.</desc>
