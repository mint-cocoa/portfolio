  <title
     id="title">Backpressure buffer timeline</title>
  <desc
     id="desc">Backpressure pauses recv rearm when send pressure crosses the high watermark, copies late completed CQE bytes into a paused FIFO, and drains that FIFO before recv resumes.</desc>
