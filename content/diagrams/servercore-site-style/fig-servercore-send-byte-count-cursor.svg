  <title
     id="title">Send byte count cursor</title>
  <desc
     id="desc">A send request asks the kernel to process a full payload range, but the completion result may report only a prefix. The session advances the send cursor by the completed byte count and resubmits the remaining suffix before starting the next payload.</desc>
