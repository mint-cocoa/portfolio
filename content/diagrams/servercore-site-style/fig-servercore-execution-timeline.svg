  <title
     id="title">ServerCore execution round trip</title>
  <desc
     id="desc">A two-lane overview of ServerCore execution. The submit path moves from upper module policy through Session and IoEvent to kernel io_uring. The completion path returns through CQE receive, user_data restore, owner dispatch, and DispatchResult.</desc>
