  <title
     id="title">IoEvent and pending I/O timeline</title>
  <desc
     id="desc">A single timeline shows that submit creates an IoEvent and increments pending_io_, kPending keeps both alive through repeated CQEs, and the final kComplete CQE completes the event and decrements pending_io_ before TryRelease checks the release gate.</desc>
