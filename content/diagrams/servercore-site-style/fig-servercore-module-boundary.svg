  <title
     id="title">Core 런타임과 선택 모듈의 책임 경계</title>
  <desc
     id="desc">Core 런타임은 세션 I/O, 버퍼, 송신 큐, 수명주기, owner ring 같은 공통 전송 책임을 제공한다. RuntimeWeb, RuntimeProxy, RuntimeGame은 같은 Core 표면을 사용하되 HTTP, 프록시, 게임 의미를 Core 밖에서 추가한다.</desc>
